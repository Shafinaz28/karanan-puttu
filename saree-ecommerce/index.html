<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" type="image/avif" href="/kpc-logo.avif" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero/hero-mustard1.png" fetchpriority="high" />
    <title>Karanan Puttu | Heritage Weaves</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f7f1e8;
        transition: visibility 0ms linear 1650ms;
      }

      #initial-loader::before,
      #initial-loader::after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: calc(50% + 1px);
        background-color: #4a0e17;
        background-image:
          linear-gradient(rgb(28 8 12 / 55%), rgb(28 8 12 / 55%)),
          url("/hero/loadingimg.avif");
        background-size: 200% 100%;
        background-repeat: no-repeat;
        content: "";
        transition: transform 1600ms cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform;
      }

      #initial-loader::before {
        left: 0;
        background-position: left center;
      }

      #initial-loader::after {
        right: 0;
        background-position: right center;
      }

      #initial-loader.is-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      #initial-loader.is-hidden::before {
        transform: translateX(-100%);
      }

      #initial-loader.is-hidden::after {
        transform: translateX(100%);
      }

      .initial-loader-content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 22px;
        text-align: center;
        transition: opacity 450ms ease 120ms;
      }

      #initial-loader.is-hidden .initial-loader-content {
        opacity: 0;
      }

      .initial-loader-logo-wrap {
        display: grid;
        place-items: center;
        padding: 18px;
        border-radius: 50%;
        background: #f6efe4;
        box-shadow: 0 10px 32px rgb(0 0 0 / 35%);
      }

      .initial-loader-logo {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }

      .initial-loader-name {
        margin: 0;
        font: 500 26px Georgia, serif;
        letter-spacing: 0.06em;
      }

      .initial-loader-track {
        width: 160px;
        height: 3px;
        overflow: hidden;
        background: rgb(243 227 184 / 25%);
      }

      .initial-loader-track::after {
        display: block;
        width: 45%;
        height: 100%;
        background: #c59b27;
        animation: initial-loader-progress 1.2s ease-in-out infinite;
        content: "";
      }

      @keyframes initial-loader-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(245%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loader-track::after { animation: none; }
        #initial-loader::before,
        #initial-loader::after,
        .initial-loader-content { transition: none; }
        #initial-loader.is-hidden::before,
        #initial-loader.is-hidden::after { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="initial-loader-content">
        <span class="initial-loader-logo-wrap">
          <img
            class="initial-loader-logo"
            src="/kpc-logo.avif"
            width="88"
            height="88"
            alt="Karnan Pattu Centre"
            decoding="async"
          />
        </span>
        <p class="initial-loader-name">Karnan Pattu Centre</p>
        <span class="initial-loader-track" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
