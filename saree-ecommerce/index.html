<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" type="image/avif" href="/hero/maroon-courtyard.avif" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/hero/family-hall.avif" />
    <link rel="preload" as="image" type="image/png" href="/loader-curtain.png" />
    <title>Karanan Puttu | Heritage Weaves</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: #f7f1e8;
        transition: visibility 800ms linear;
      }

      #initial-loader::before,
      #initial-loader::after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background-color: #4a0e17;
        background-image:
          linear-gradient(rgb(35 6 12 / 25%), rgb(35 6 12 / 25%)),
          url("/loader-curtain.png");
        background-size: 100vw 100vh;
        content: "";
        transition: transform 800ms cubic-bezier(0.76, 0, 0.24, 1);
      }

      #initial-loader::before {
        left: 0;
        background-position: left center;
      }

      #initial-loader::after {
        right: 0;
        background-position: right center;
      }

      #initial-loader.is-hidden {
        visibility: hidden;
        transition-delay: 800ms;
      }

      #initial-loader.is-hidden::before {
        transform: translateX(-100%);
      }

      #initial-loader.is-hidden::after {
        transform: translateX(100%);
      }

      .initial-loader-content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
        transition: opacity 200ms ease;
      }

      #initial-loader.is-hidden .initial-loader-content {
        opacity: 0;
      }

      .initial-loader-logo-wrap {
        position: relative;
        display: grid;
        width: 100px;
        height: 100px;
        place-items: center;
      }

      .initial-loader-logo-wrap::before {
        position: absolute;
        inset: 0;
        border: 2px solid rgb(197 155 39 / 25%);
        border-top-color: #c59b27;
        border-radius: 50%;
        animation: initial-loader-spin 1.2s linear infinite;
        content: "";
      }

      .initial-loader-logo {
        position: relative;
        z-index: 1;
        width: 68px;
        height: 68px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      .initial-loader-name {
        margin: 0;
        font: 500 22px Georgia, serif;
        letter-spacing: 0.06em;
      }

      .initial-loader-message {
        margin: 0;
        color: #f3e3b8;
        font: 10px Arial, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .initial-loader-track {
        width: 132px;
        height: 2px;
        overflow: hidden;
        background: rgb(243 227 184 / 25%);
      }

      .initial-loader-track::after {
        display: block;
        width: 45%;
        height: 100%;
        background: #c59b27;
        animation: initial-loader-progress 1.2s ease-in-out infinite;
        content: "";
      }

      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes initial-loader-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(245%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loader-logo-wrap::before,
        .initial-loader-track::after { animation: none; }
        #initial-loader,
        #initial-loader::before,
        #initial-loader::after,
        .initial-loader-content { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-live="polite">
      <div class="initial-loader-content">
        <span class="initial-loader-logo-wrap">
          <img class="initial-loader-logo" alt="" />
        </span>
        <p class="initial-loader-name">Karnan Pattu Centre</p>
        <p class="initial-loader-message">Preparing your visit</p>
        <span class="initial-loader-track" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
