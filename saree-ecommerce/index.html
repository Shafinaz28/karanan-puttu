<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" href="/loader-background.png" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/kpc-logo.avif" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/hero/slides/banner-1.avif?v=3" fetchpriority="low" />
    <title>Karanan Puttu | Heritage Weaves</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: transparent;
        color: #f7f1e8;
        pointer-events: auto;
      }

      #initial-loader.is-hidden {
        pointer-events: none;
      }

      .initial-loader-panel {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 0;
        width: calc(50% + 1px);
        overflow: hidden;
        background-color: #1a0508;
        background-image: url("/loader-background.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center center;
        background-attachment: scroll;
        transition: transform 1200ms cubic-bezier(0.45, 0, 0.2, 1);
        will-change: transform;
      }

      .initial-loader-panel--left {
        left: 0;
      }

      .initial-loader-panel--right {
        right: 0;
      }

      #initial-loader.is-hidden .initial-loader-panel--left {
        transform: translateX(-100%);
      }

      #initial-loader.is-hidden .initial-loader-panel--right {
        transform: translateX(100%);
      }

      .initial-loader-content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 22px;
        text-align: center;
        transition: opacity 450ms ease 120ms;
      }

      #initial-loader.is-hidden .initial-loader-content {
        opacity: 0;
      }

      .initial-loader-logo-wrap {
        display: grid;
        place-items: center;
      }

      .initial-loader-logo {
        width: 88px;
        height: 88px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgb(0 0 0 / 35%));
      }

      .initial-loader-name {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-shadow: 0 2px 12px rgb(0 0 0 / 45%);
      }

      .initial-loader-track {
        width: 160px;
        height: 3px;
        overflow: hidden;
        background: rgb(243 227 184 / 25%);
      }

      .initial-loader-track::after {
        display: block;
        width: 45%;
        height: 100%;
        background: #c59b27;
        animation: initial-loader-progress 1.2s ease-in-out infinite;
        content: "";
      }

      @keyframes initial-loader-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(245%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loader-track::after { animation: none; }
        .initial-loader-panel,
        .initial-loader-content { transition: none; }
        #initial-loader.is-hidden .initial-loader-panel--left,
        #initial-loader.is-hidden .initial-loader-panel--right { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="initial-loader-panel initial-loader-panel--left" aria-hidden="true"></div>
      <div class="initial-loader-panel initial-loader-panel--right" aria-hidden="true"></div>
      <div class="initial-loader-content">
        <span class="initial-loader-logo-wrap">
          <img
            class="initial-loader-logo"
            src="/kpc-logo.avif"
            width="88"
            height="88"
            alt="Karnan Pattu Centre"
            decoding="async"
          />
        </span>
        <p class="initial-loader-name">Karnan Pattu Centre</p>
        <span class="initial-loader-track" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
